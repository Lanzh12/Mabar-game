<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fcde8">
<title>Desa Kopdes · main bareng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--merah:#d2232a;--putih:#fff8ee;--hijau:#1f4d2b;--tanah:#b8864b;--langit:#8fcde8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--langit);font-family:'Fredoka',system-ui,sans-serif;color:var(--hijau);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}

/* zona sentuh */
#joyzone{position:fixed;left:0;top:0;bottom:0;width:45%;z-index:2}
#look{position:fixed;right:0;top:0;bottom:0;width:55%;z-index:2}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,248,238,.2);border:2px solid rgba(255,248,238,.65);z-index:3;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,248,238,.9);box-shadow:0 2px 6px rgba(0,0,0,.2)}
#run{position:fixed;right:max(28px,env(safe-area-inset-right));bottom:28px;width:88px;height:88px;border-radius:50%;background:var(--merah);color:var(--putih);border:3px solid var(--putih);font:600 19px 'Fredoka',system-ui,sans-serif;z-index:4;box-shadow:0 3px 10px rgba(0,0,0,.25);touch-action:none}
#run.on{transform:scale(.93);background:#a81b21}

/* HUD */
#topright{position:fixed;right:max(12px,env(safe-area-inset-right));top:10px;display:flex;gap:8px;align-items:center;z-index:6}
#hud{background:rgba(31,77,43,.82);color:var(--putih);padding:8px 14px;border-radius:20px;font-size:14px;font-weight:500;white-space:nowrap}
#chatbtn{background:var(--putih);color:var(--hijau);border:2px solid var(--hijau);border-radius:20px;padding:7px 16px;font:600 15px 'Fredoka',system-ui,sans-serif;cursor:pointer}
#chat{position:fixed;left:max(12px,env(safe-area-inset-left));top:10px;width:min(42vw,340px);z-index:6;pointer-events:none}
#chatrow{display:none;gap:6px;margin-bottom:6px;pointer-events:auto}
#chatin{flex:1;min-width:0;border:2px solid var(--hijau);border-radius:16px;padding:8px 12px;font:500 15px 'Fredoka',system-ui,sans-serif;background:var(--putih);color:var(--hijau);user-select:text;-webkit-user-select:text}
#chatrow button{background:var(--merah);color:var(--putih);border:0;border-radius:16px;padding:0 14px;font:600 15px 'Fredoka',system-ui,sans-serif}
#log{display:flex;flex-direction:column;gap:4px;max-height:42vh;overflow:hidden;justify-content:flex-start}
.msg{background:rgba(255,248,238,.88);border-radius:12px;padding:5px 10px;font-size:14px;line-height:1.25;word-break:break-word;width:fit-content;max-width:100%}
.msg b{color:var(--merah);font-weight:600;margin-right:6px}
.msg.sys{background:rgba(31,77,43,.75);color:var(--putih);font-size:13px}
#log:not(.open) .msg.old{display:none}

/* layar awal */
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(143,205,232,.25),rgba(31,77,43,.35));padding:12px}
#card{background:rgba(255,248,238,.95);border-radius:22px;padding:18px 22px;width:min(94vw,620px);display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#card h1{margin:0 0 6px;font-size:34px;line-height:1;color:var(--merah);font-weight:600}
#card p{margin:0;font-size:15px;line-height:1.35}
#card label{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
#nama{width:100%;border:2px solid var(--hijau);border-radius:14px;padding:9px 12px;font:500 16px 'Fredoka',system-ui,sans-serif;background:#fff;color:var(--hijau);user-select:text;-webkit-user-select:text}
#warna{display:flex;gap:7px;margin:10px 0 12px;flex-wrap:wrap}
#warna button{width:28px;height:28px;border-radius:50%;border:3px solid transparent;padding:0;cursor:pointer}
#warna button.pilih{border-color:var(--hijau);box-shadow:0 0 0 2px var(--putih) inset}
#mulai{width:100%;background:var(--merah);color:var(--putih);border:0;border-radius:16px;padding:12px;font:600 18px 'Fredoka',system-ui,sans-serif;cursor:pointer}
#err{color:var(--merah);font-size:13px;margin-top:6px}

/* gerbang landscape */
#rotate{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--hijau);color:var(--putih);text-align:center;padding:24px}
#rotate .hp{width:54px;height:92px;border:5px solid var(--putih);border-radius:12px;position:relative;animation:putar 2.4s ease-in-out infinite}
#rotate .hp::after{content:'';position:absolute;left:50%;bottom:6px;width:16px;height:4px;margin-left:-8px;background:var(--putih);border-radius:2px}
@keyframes putar{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
#rotate h2{margin:0;font-size:24px;font-weight:600}
#rotate p{margin:0;font-size:16px;max-width:300px;line-height:1.35}
@media (prefers-reduced-motion:reduce){#rotate .hp{animation:none;transform:rotate(-90deg)}}
@media (max-width:620px){#card{grid-template-columns:1fr;gap:10px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="joyzone"></div>
<div id="look"></div>
<div id="joy"><div id="knob"></div></div>
<button id="run" type="button">Lari</button>

<div id="chat">
  <form id="chatrow" autocomplete="off">
    <input id="chatin" maxlength="120" placeholder="Tulis pesan untuk semua pemain" enterkeyhint="send">
    <button type="submit">Kirim</button>
  </form>
  <div id="log"></div>
</div>
<div id="topright">
  <div id="hud">Menyambung…</div>
  <button id="chatbtn" type="button">Chat</button>
</div>

<div id="start">
  <div id="card">
    <div>
      <h1>Desa Kopdes</h1>
      <p>Keliling desa bareng teman, mampir ke Kopdes, dan ngobrol dengan semua pemain yang online.</p>
    </div>
    <div>
      <label for="nama">Nama kamu</label>
      <input id="nama" maxlength="12" placeholder="Contoh: Budi" autocomplete="off">
      <div id="warna" aria-label="Pilih warna baju"></div>
      <button id="mulai" type="button">Masuk desa</button>
      <div id="err"></div>
    </div>
  </div>
</div>

<div id="rotate">
  <div class="hp"></div>
  <h2>Putar HP ke mode landscape</h2>
  <p>Game ini cuma bisa dimainkan dengan layar miring. Matikan kunci rotasi layar kalau layar tidak mau berputar.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============ PENGATURAN ============
   Isi dua baris ini dari Supabase (Project Settings → API).
   Kalau kosong, game jalan dalam mode tes lokal (cuma antar-tab di browser yang sama). */
const SUPABASE_URL = '';       // contoh: 'https://abcdxyz.supabase.co'
const SUPABASE_ANON_KEY = '';  // anon public key
const CHANNEL = 'desa-kopdes-global';
/* ==================================== */

(() => {
'use strict';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerpAngle = (a, b, t) => {
  const d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  return a + d * t;
};

if (typeof THREE === 'undefined') {
  $('err').textContent = 'Three.js gagal dimuat. Cek koneksi internet lalu muat ulang.';
  return;
}

const BOUND = 48;
const COLORS = [0xe4572e, 0x29a3a3, 0xf2b134, 0x6a4c93, 0x2e933c, 0xd7428a, 0x3a6ea5, 0xef8354];
const SKIN = [0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524];

/* ---------- renderer & scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('game'), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fcde8);
scene.fog = new THREE.Fog(0x8fcde8, 45, 120);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 220);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6b8f4e, 0.9));
const sun = new THREE.DirectionalLight(0xfff1d6, 0.7);
sun.position.set(30, 50, 20);
scene.add(sun);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  setJoyDefault();
  $('rotate').style.display = h > w ? 'flex' : 'none';
}

/* ---------- helper bangun dunia ---------- */
const mats = {};
const mat = c => mats[c] || (mats[c] = new THREE.MeshLambertMaterial({ color: c }));
function box(w, h, d, c, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
const boxes = [], circles = [], zonaKosong = [];
const solidBox = (cx, cz, w, d) => boxes.push({ x0: cx - w / 2, x1: cx + w / 2, z0: cz - d / 2, z1: cz + d / 2 });
const solidCircle = (x, z, r) => circles.push({ x, z, r });

function roof(cx, cy, cz, len, depth, rise, color) {
  const half = depth / 2, sl = Math.hypot(half, rise) + 0.3, ang = Math.atan2(rise, half);
  const a = box(len, 0.35, sl, color, cx, cy + rise / 2 + 0.1, cz - half / 2);
  a.rotation.x = -ang;
  const b = box(len, 0.35, sl, color, cx, cy + rise / 2 + 0.1, cz + half / 2);
  b.rotation.x = ang;
}
function gable(x, cy, cz, depth, rise, color) {
  const s = new THREE.Shape();
  s.moveTo(-depth / 2, 0); s.lineTo(depth / 2, 0); s.lineTo(0, rise);
  const m = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide }));
  m.rotation.y = Math.PI / 2;
  m.position.set(x, cy, cz);
  scene.add(m);
}

/* ---------- tanah, jalan, sawah, tembok ---------- */
(function bangunTanah() {
  const outer = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), mat(0x6e9f45));
  outer.rotation.x = -Math.PI / 2; outer.position.y = -0.03; scene.add(outer);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(BOUND * 2 + 2, BOUND * 2 + 2), mat(0x86b94f));
  g.rotation.x = -Math.PI / 2; scene.add(g);

  box(5, 0.06, 61, 0xc9a66b, 0, 0.03, 15.5);
  box(BOUND * 2 - 4, 0.06, 5, 0xc9a66b, 0, 0.03, 12);

  function sawah(cx, cz, w, d) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const c = cv.getContext('2d');
    c.fillStyle = '#9bd05a'; c.fillRect(0, 0, 64, 64);
    c.fillStyle = '#7fb83f';
    for (let i = 0; i < 64; i += 16) c.fillRect(0, i, 64, 8);
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(w / 4, d / 4);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshLambertMaterial({ map: t }));
    m.rotation.x = -Math.PI / 2; m.position.set(cx, 0.05, cz); scene.add(m);
    zonaKosong.push({ x0: cx - w / 2, x1: cx + w / 2, z0: cz - d / 2, z1: cz + d / 2 });
  }
  sawah(-30, -26, 22, 16);
  sawah(30, -32, 20, 14);

  // tembok pembatas: dinding krem + pita merah-putih di atas
  const L = BOUND * 2 + 2;
  [[0, -BOUND, L, 1.2], [0, BOUND, L, 1.2], [-BOUND, 0, 1.2, L], [BOUND, 0, 1.2, L]].forEach(([x, z, w, d]) => {
    box(w, 3, d, 0xd8c7a5, x, 1.5, z);
    box(w + (w > d ? 0 : 0.2), 0.45, d + (d > w ? 0 : 0.2), 0xd2232a, x, 2.7, z);
    box(w + (w > d ? 0 : 0.3), 0.25, d + (d > w ? 0 : 0.3), 0xfff8ee, x, 3.05, z);
  });
})();

/* ---------- Kopdes ---------- */
(function kopdes(cx, cz) {
  const w = 16, d = 9, h = 6;
  box(w, h, d, 0xfff8ee, cx, h / 2, cz);
  box(w + 0.2, 0.9, d + 0.2, 0xd2232a, cx, 0.45, cz);
  box(w + 0.2, 0.9, d + 0.2, 0xd2232a, cx, h - 0.45, cz);
  roof(cx, h, cz, w + 1.4, d + 1.2, 2.6, 0x9c1c22);
  gable(cx - w / 2 - 0.05, h, cz, d + 0.4, 2.4, 0xfff8ee);
  gable(cx + w / 2 + 0.05, h, cz, d + 0.4, 2.4, 0xfff8ee);

  const fz = cz + d / 2;
  box(w + 2, 0.3, 3, 0xcfc3ad, cx, 0.15, fz + 1.5);
  box(2.8, 3.2, 0.2, 0x7a4a24, cx, 1.9, fz + 0.06);
  box(0.2, 3.2, 0.22, 0x4d2e14, cx, 1.9, fz + 0.08);
  [-5.2, -2.9, 2.9, 5.2].forEach(dx => {
    box(1.7, 1.5, 0.18, 0x6fb7d8, cx + dx * 1.0, 2.9, fz + 0.06);
    box(1.9, 0.14, 0.24, 0xd2232a, cx + dx * 1.0, 3.7, fz + 0.07);
  });
  [-6.6, 6.6].forEach(dx => box(0.35, 4.6, 0.35, 0xfff8ee, cx + dx, 2.5, fz + 2.6));
  box(w + 1.4, 0.35, 0.5, 0xd2232a, cx, 4.85, fz + 2.6);

  // papan nama
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 160;
  const c = cv.getContext('2d');
  c.fillStyle = '#d2232a'; c.fillRect(0, 0, 1024, 160);
  c.strokeStyle = '#fff8ee'; c.lineWidth = 10; c.strokeRect(10, 10, 1004, 140);
  c.fillStyle = '#fff8ee'; c.font = '600 84px Fredoka, Arial, sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('KOPDES MERAH PUTIH', 512, 84);
  const tex = new THREE.CanvasTexture(cv);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(9.6, 1.5), new THREE.MeshBasicMaterial({ map: tex }));
  sign.position.set(cx, 4.45, fz + 0.12);
  scene.add(sign);

  // tiang bendera merah putih
  [-9.5, 9.5].forEach(dx => {
    const px = cx + dx, pz = fz + 2.2;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 8, 8), mat(0xdddddd));
    pole.position.set(px, 4, pz); scene.add(pole);
    box(0.02, 0.6, 1.7, 0xd2232a, px, 7.4, pz + 0.9);
    box(0.02, 0.6, 1.7, 0xffffff, px, 6.8, pz + 0.9);
    solidCircle(px, pz, 0.25);
  });
  solidBox(cx, cz, w + 0.4, d + 0.4);
})(0, -22);

/* ---------- rumah warga ---------- */
function rumah(cx, cz, w, d, wall, rf) {
  const h = 3;
  box(w, h, d, wall, cx, h / 2, cz);
  roof(cx, h, cz, w + 0.8, d + 0.8, 1.7, rf);
  gable(cx - w / 2 - 0.02, h, cz, d + 0.3, 1.5, wall);
  gable(cx + w / 2 + 0.02, h, cz, d + 0.3, 1.5, wall);
  box(1.1, 2, 0.15, 0x6b4423, cx - w / 4, 1, cz + d / 2 + 0.04);
  box(1.2, 0.95, 0.15, 0x6fb7d8, cx + w / 4, 1.8, cz + d / 2 + 0.04);
  solidBox(cx, cz, w + 0.3, d + 0.3);
}
rumah(-15, -4, 7, 6, 0xf2e3c6, 0x8a4b2d);
rumah(15, -4, 6, 6, 0xcfe3c0, 0x7a3b3b);
rumah(-20, 26, 7, 6, 0xf7d9a8, 0x4f6d7a);
rumah(20, 24, 6, 6, 0xe9c9c9, 0x8a4b2d);
rumah(-16, 38, 6, 5, 0xd5e6ef, 0x7a3b3b);
rumah(18, 38, 7, 5, 0xf2e3c6, 0x4f6d7a);

/* ---------- pohon ---------- */
function bebas(x, z, r) {
  if (Math.abs(x) < 4.5 || Math.abs(z - 12) < 4.5) return false;
  if (Math.hypot(x, z - 15) < 7) return false;
  if (Math.abs(x) > BOUND - 3 || Math.abs(z) > BOUND - 3) return false;
  for (const b of boxes) if (x > b.x0 - r - 2 && x < b.x1 + r + 2 && z > b.z0 - r - 2 && z < b.z1 + r + 2) return false;
  for (const b of zonaKosong) if (x > b.x0 - 1 && x < b.x1 + 1 && z > b.z0 - 1 && z < b.z1 + 1) return false;
  for (const c of circles) if (Math.hypot(x - c.x, z - c.z) < c.r + r + 2) return false;
  return true;
}
for (let n = 0, ok = 0; n < 500 && ok < 32; n++) {
  const x = rand(-BOUND, BOUND), z = rand(-BOUND, BOUND), s = rand(0.9, 1.4);
  if (!bebas(x, z, 0.5 * s)) continue;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25 * s, 0.35 * s, 2.2 * s, 6), mat(0x7a5230));
  trunk.position.set(x, 1.1 * s, z); scene.add(trunk);
  const top = new THREE.Mesh(new THREE.IcosahedronGeometry(1.7 * s, 0), mat(Math.random() < 0.5 ? 0x3f8f3a : 0x4aa044));
  top.position.set(x, 3.3 * s, z); scene.add(top);
  solidCircle(x, z, 0.5 * s);
  ok++;
}

/* ---------- avatar ---------- */
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
const allLabels = [];
function makeLabel(name) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 192;
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(4, 1.5, 1); sp.position.y = 3.2; sp.renderOrder = 10;
  const L = {
    sp, name, msg: '', until: 0,
    draw() {
      const c = cv.getContext('2d');
      c.clearRect(0, 0, 512, 192);
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = '600 40px Fredoka, system-ui, sans-serif';
      const w = Math.min(c.measureText(L.name).width + 36, 500);
      rr(c, 256 - w / 2, 128, w, 52, 26); c.fillStyle = 'rgba(31,77,43,.82)'; c.fill();
      c.fillStyle = '#fff8ee'; c.fillText(L.name, 256, 155);
      if (L.msg) {
        c.font = '500 34px Fredoka, system-ui, sans-serif';
        const t = L.msg.length > 28 ? L.msg.slice(0, 27) + '…' : L.msg;
        const bw = Math.min(c.measureText(t).width + 40, 504);
        rr(c, 256 - bw / 2, 50, bw, 62, 22); c.fillStyle = '#fff8ee'; c.fill();
        c.lineWidth = 4; c.strokeStyle = '#d2232a'; c.stroke();
        c.fillStyle = '#1f4d2b'; c.fillText(t, 256, 82);
      }
      tex.needsUpdate = true;
    },
    say(t) { L.msg = t; L.until = performance.now() + 6000; L.draw(); }
  };
  L.draw();
  allLabels.push(L);
  return L;
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => allLabels.forEach(l => l.draw()));

function makeAvatar(name, ci) {
  const g = new THREE.Group();
  const c = COLORS[ci % COLORS.length], skin = SKIN[ci % SKIN.length];
  box(0.7, 0.85, 0.4, c, 0, 1.15, 0, g);
  box(0.5, 0.5, 0.5, skin, 0, 1.85, 0, g);
  box(0.53, 0.16, 0.53, 0x2b2118, 0, 2.07, 0, g);
  box(0.08, 0.08, 0.02, 0x222222, -0.12, 1.88, 0.26, g);
  box(0.08, 0.08, 0.02, 0x222222, 0.12, 1.88, 0.26, g);
  const pivot = (x, y, bw, bh, col) => {
    const p = new THREE.Group(); p.position.set(x, y, 0);
    box(bw, bh, 0.3, col, 0, -bh / 2, 0, p); g.add(p); return p;
  };
  const legL = pivot(-0.18, 0.75, 0.28, 0.75, 0x2f3e5c);
  const legR = pivot(0.18, 0.75, 0.28, 0.75, 0x2f3e5c);
  const armL = pivot(-0.47, 1.52, 0.2, 0.7, skin);
  const armR = pivot(0.47, 1.52, 0.2, 0.7, skin);
  const blob = new THREE.Mesh(new THREE.CircleGeometry(0.6, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.07; g.add(blob);
  const label = makeLabel(name);
  g.add(label.sp);
  scene.add(g);
  return { g, label, legL, legR, armL, armR, phase: 0, amp: 0 };
}
function animateAvatar(av, speed, dt) {
  av.phase += dt * (4 + speed * 1.2);
  av.amp += (Math.min(speed / 4.2, 1.2) - av.amp) * Math.min(dt * 10, 1);
  const s = Math.sin(av.phase) * 0.8 * av.amp;
  av.legL.rotation.x = s; av.legR.rotation.x = -s;
  av.armL.rotation.x = -s; av.armR.rotation.x = s;
}

/* ---------- state pemain ---------- */
const me = { id: Math.random().toString(36).slice(2, 10), name: '', color: 0, x: 0, z: 15, rot: 0 };
let meAv = null;
const players = new Map();
let yaw = 0, pitch = 0.5, curSpeed = 0, started = false, chatOpen = false;

/* ---------- kontrol ---------- */
const input = { x: 0, y: 0 };
const keys = {};
let runHeld = false;

const joy = $('joy'), knob = $('knob'), joyzone = $('joyzone');
let joyId = null, joyC = { x: 0, y: 0 }, joyDef = { x: 110, y: 300 };
function joyReset() {
  joy.style.left = joyDef.x + 'px'; joy.style.top = joyDef.y + 'px';
  knob.style.transform = 'translate(0,0)'; input.x = 0; input.y = 0;
}
function setJoyDefault() {
  joyDef = { x: Math.max(100, window.innerWidth * 0.12), y: window.innerHeight - 100 };
  if (joyId === null) joyReset();
}
function joyMove(e) {
  const R = 50;
  let dx = e.clientX - joyC.x, dy = e.clientY - joyC.y;
  const len = Math.hypot(dx, dy);
  if (len > R) { dx = dx / len * R; dy = dy / len * R; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  const mx = dx / R, my = -dy / R;
  if (Math.hypot(mx, my) < 0.15) { input.x = 0; input.y = 0; } else { input.x = mx; input.y = my; }
}
joyzone.addEventListener('pointerdown', e => {
  if (joyId !== null) return;
  joyId = e.pointerId; joyzone.setPointerCapture(e.pointerId);
  joyC = { x: e.clientX, y: e.clientY };
  joy.style.left = joyC.x + 'px'; joy.style.top = joyC.y + 'px';
  joyMove(e);
});
joyzone.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId === joyId) { joyId = null; joyReset(); } };
joyzone.addEventListener('pointerup', joyEnd);
joyzone.addEventListener('pointercancel', joyEnd);

const look = $('look');
let lookId = null, lx = 0, ly = 0;
look.addEventListener('pointerdown', e => {
  if (lookId !== null) return;
  lookId = e.pointerId; look.setPointerCapture(e.pointerId); lx = e.clientX; ly = e.clientY;
});
look.addEventListener('pointermove', e => {
  if (e.pointerId !== lookId) return;
  yaw -= (e.clientX - lx) * 0.006;
  pitch = clamp(pitch + (e.clientY - ly) * 0.004, 0.15, 1.2);
  lx = e.clientX; ly = e.clientY;
});
const lookEnd = e => { if (e.pointerId === lookId) lookId = null; };
look.addEventListener('pointerup', lookEnd);
look.addEventListener('pointercancel', lookEnd);

const runBtn = $('run');
runBtn.addEventListener('pointerdown', e => { runHeld = true; runBtn.classList.add('on'); runBtn.setPointerCapture(e.pointerId); });
const runEnd = () => { runHeld = false; runBtn.classList.remove('on'); };
runBtn.addEventListener('pointerup', runEnd);
runBtn.addEventListener('pointercancel', runEnd);

window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') closeChat();
    return;
  }
  if (e.key === 'Enter' && started) { e.preventDefault(); openChat(); return; }
  keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- tabrakan ---------- */
function collide(p, r) {
  for (const b of boxes) {
    const x0 = b.x0 - r, x1 = b.x1 + r, z0 = b.z0 - r, z1 = b.z1 + r;
    if (p.x > x0 && p.x < x1 && p.z > z0 && p.z < z1) {
      const dl = p.x - x0, dr = x1 - p.x, dt = p.z - z0, db = z1 - p.z;
      const m = Math.min(dl, dr, dt, db);
      if (m === dl) p.x = x0; else if (m === dr) p.x = x1; else if (m === dt) p.z = z0; else p.z = z1;
    }
  }
  for (const c of circles) {
    const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), min = c.r + r;
    if (d < min) {
      if (d < 1e-4) p.x += min; else { p.x = c.x + dx / d * min; p.z = c.z + dz / d * min; }
    }
  }
  const lim = BOUND - 1;
  p.x = clamp(p.x, -lim, lim); p.z = clamp(p.z, -lim, lim);
}

/* ---------- chat ---------- */
const logEl = $('log');
function addChat(name, text, kind) {
  const d = document.createElement('div');
  d.className = 'msg' + (kind === 'sys' ? ' sys' : '');
  d.dataset.t = Date.now();
  if (kind === 'sys') d.textContent = text;
  else { const b = document.createElement('b'); b.textContent = name; d.appendChild(b); d.appendChild(document.createTextNode(text)); }
  logEl.appendChild(d);
  while (logEl.children.length > 40) logEl.removeChild(logEl.firstChild);
  // tampilkan hanya yang terbaru; sisanya disembunyikan oleh CSS "old"
  const kids = Array.from(logEl.children);
  kids.forEach((k, i) => k.classList.toggle('old', i < kids.length - 6 || Date.now() - k.dataset.t > 12000));
}
setInterval(() => {
  const kids = Array.from(logEl.children);
  kids.forEach((k, i) => k.classList.toggle('old', i < kids.length - 6 || Date.now() - k.dataset.t > 12000));
}, 1000);

function openChat() {
  chatOpen = true;
  $('chatrow').style.display = 'flex';
  logEl.classList.add('open');
  $('chatin').focus();
}
function closeChat() {
  chatOpen = false;
  $('chatrow').style.display = 'none';
  logEl.classList.remove('open');
  $('chatin').blur();
}
$('chatbtn').addEventListener('click', () => (chatOpen ? closeChat() : openChat()));
let lastChat = 0;
$('chatrow').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('chatin');
  const t = inp.value.trim().slice(0, 120);
  if (!t) { closeChat(); return; }
  const now = Date.now();
  if (now - lastChat < 800) return;
  lastChat = now;
  inp.value = '';
  net.send('chat', { id: me.id, n: me.name, t });
  addChat(me.name, t);
  if (meAv) meAv.label.say(t.slice(0, 60));
  closeChat();
});

/* ---------- jaringan ---------- */
const net = { send() {}, ready: false, mode: 'lokal' };
function startNet() {
  if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { realtime: { params: { eventsPerSecond: 10 } } });
    const ch = client.channel(CHANNEL, { config: { broadcast: { self: false } } });
    ['pos', 'chat', 'bye'].forEach(ev => ch.on('broadcast', { event: ev }, m => onEvt(ev, m.payload)));
    ch.subscribe(status => { net.ready = status === 'SUBSCRIBED'; });
    net.send = (ev, payload) => { if (net.ready) ch.send({ type: 'broadcast', event: ev, payload }); };
    net.mode = 'online';
  } else if ('BroadcastChannel' in window) {
    const bc = new BroadcastChannel(CHANNEL);
    bc.onmessage = e => onEvt(e.data.ev, e.data.payload);
    net.send = (ev, payload) => bc.postMessage({ ev, payload });
    net.ready = true; net.mode = 'lokal';
  }
}
function onEvt(ev, p) {
  if (!p || typeof p !== 'object' || p.id === me.id) return;
  const name = String(p.n || 'Warga').slice(0, 14);
  if (ev === 'pos') {
    const x = Number(p.x), z = Number(p.z), r = Number(p.r);
    if (!isFinite(x) || !isFinite(z)) return;
    let o = players.get(p.id);
    if (!o) {
      o = { av: makeAvatar(name, Number(p.c) || 0), name, x, z, r: r || 0, tx: x, tz: z, tr: r || 0, last: 0 };
      o.av.g.position.set(x, 0, z);
      players.set(p.id, o);
      addChat('', name + ' masuk desa', 'sys');
    }
    o.tx = clamp(x, -BOUND, BOUND); o.tz = clamp(z, -BOUND, BOUND); o.tr = isFinite(r) ? r : o.tr;
    o.last = performance.now();
  } else if (ev === 'chat') {
    const t = String(p.t || '').slice(0, 120);
    if (!t) return;
    addChat(name, t);
    const o = players.get(p.id);
    if (o) o.av.label.say(t.slice(0, 60));
  } else if (ev === 'bye') {
    removeRemote(p.id);
  }
}
function removeRemote(id) {
  const o = players.get(id);
  if (!o) return;
  scene.remove(o.av.g);
  const i = allLabels.indexOf(o.av.label); if (i >= 0) allLabels.splice(i, 1);
  players.delete(id);
  addChat('', o.name + ' keluar desa', 'sys');
}
window.addEventListener('pagehide', () => net.send('bye', { id: me.id }));

/* ---------- layar awal ---------- */
const warnaEl = $('warna');
COLORS.forEach((c, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.style.background = '#' + c.toString(16).padStart(6, '0');
  b.setAttribute('aria-label', 'Warna ' + (i + 1));
  b.addEventListener('click', () => { me.color = i; Array.from(warnaEl.children).forEach((k, j) => k.classList.toggle('pilih', j === i)); });
  warnaEl.appendChild(b);
});
me.color = Math.floor(rand(0, COLORS.length));
warnaEl.children[me.color].classList.add('pilih');
try { $('nama').value = localStorage.getItem('nama') || ''; } catch (e) {}

$('mulai').addEventListener('click', () => {
  const n = $('nama').value.trim().slice(0, 12) || 'Warga' + Math.floor(rand(100, 999));
  me.name = n;
  try { localStorage.setItem('nama', n); } catch (e) {}
  try {
    const el = document.documentElement, rf = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rf) Promise.resolve(rf.call(el)).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => {});
  } catch (e) {}
  me.x = rand(-3, 3); me.z = rand(14, 18);
  meAv = makeAvatar(me.name, me.color);
  meAv.g.position.set(me.x, 0, me.z);
  $('start').style.display = 'none';
  started = true;
  startNet();
  net.send('pos', { id: me.id, n: me.name, c: me.color, x: me.x, z: me.z, r: me.rot });
  addChat('', 'Selamat datang, ' + me.name + '!', 'sys');
});

/* ---------- loop ---------- */
let last = performance.now(), netT = 0, hudT = 0, sx = 0, sz = 0, sr = 0;
function update(dt, now) {
  let ix = input.x, iy = input.y;
  if (!chatOpen) {
    if (keys.KeyA || keys.ArrowLeft) ix -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1;
    if (keys.KeyW || keys.ArrowUp) iy += 1;
    if (keys.KeyS || keys.ArrowDown) iy -= 1;
  }
  const mag = Math.hypot(ix, iy);
  const run = runHeld || keys.ShiftLeft || keys.ShiftRight;
  const speed = run ? 7.5 : 4.2;
  if (mag > 0.05) {
    const m = Math.min(mag, 1);
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    let dx = fx * iy + rx * ix, dz = fz * iy + rz * ix;
    const l = Math.hypot(dx, dz); dx /= l; dz /= l;
    me.x += dx * speed * m * dt; me.z += dz * speed * m * dt;
    collide(me, 0.45);
    me.rot = lerpAngle(me.rot, Math.atan2(dx, dz), 1 - Math.exp(-14 * dt));
    curSpeed = speed * m;
  } else curSpeed = 0;

  meAv.g.position.set(me.x, 0, me.z);
  meAv.g.rotation.y = me.rot;
  animateAvatar(meAv, curSpeed, dt);
  if (meAv.label.msg && now > meAv.label.until) { meAv.label.msg = ''; meAv.label.draw(); }

  const d = 7, ch = Math.cos(pitch);
  camera.position.set(
    clamp(me.x + Math.sin(yaw) * ch * d, -BOUND + 0.5, BOUND - 0.5),
    1.6 + Math.sin(pitch) * d,
    clamp(me.z + Math.cos(yaw) * ch * d, -BOUND + 0.5, BOUND - 0.5)
  );
  camera.lookAt(me.x, 1.5, me.z);

  netT += dt * 1000;
  const moved = Math.abs(me.x - sx) > 0.02 || Math.abs(me.z - sz) > 0.02 || Math.abs(me.rot - sr) > 0.05;
  if ((moved && netT > 150) || netT > 1000) {
    net.send('pos', { id: me.id, n: me.name, c: me.color, x: +me.x.toFixed(2), z: +me.z.toFixed(2), r: +me.rot.toFixed(2) });
    sx = me.x; sz = me.z; sr = me.rot; netT = 0;
  }

  for (const [id, o] of Array.from(players)) {
    if (now - o.last > 5000) { removeRemote(id); continue; }
    const k = 1 - Math.exp(-12 * dt), px = o.x, pz = o.z;
    o.x += (o.tx - o.x) * k; o.z += (o.tz - o.z) * k;
    o.r = lerpAngle(o.r, o.tr, k);
    o.av.g.position.set(o.x, 0, o.z); o.av.g.rotation.y = o.r;
    animateAvatar(o.av, Math.hypot(o.x - px, o.z - pz) / Math.max(dt, 0.001), dt);
    const L = o.av.label;
    if (L.msg && now > L.until) { L.msg = ''; L.draw(); }
  }

  hudT += dt;
  if (hudT > 0.5) {
    hudT = 0;
    const n = players.size + 1;
    $('hud').textContent = net.mode === 'online'
      ? (net.ready ? '● ' + n + ' pemain online' : 'Menyambung…')
      : 'Mode tes · ' + n + ' pemain';
  }
}
function orbit(now) {
  const a = now * 0.00008;
  camera.position.set(Math.sin(a) * 36, 13, -10 + Math.cos(a) * 36);
  camera.lookAt(0, 3, -12);
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (started) update(dt, now); else orbit(now);
  renderer.render(scene, camera);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
$('hud').textContent = 'Siap masuk';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
