<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8fcde8">
<title>Desa Kopdes · main bareng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--merah:#d2232a;--putih:#fff8ee;--hijau:#1f4d2b;--tanah:#b8864b;--langit:#8fcde8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--langit);font-family:'Fredoka',system-ui,sans-serif;color:var(--hijau);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}

/* zona sentuh */
#joyzone{position:fixed;left:0;top:0;bottom:0;width:45%;z-index:2}
#look{position:fixed;right:0;top:0;bottom:0;width:55%;z-index:2}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,248,238,.2);border:2px solid rgba(255,248,238,.65);z-index:3;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,248,238,.9);box-shadow:0 2px 6px rgba(0,0,0,.2)}
#run,#jump{position:fixed;border-radius:50%;color:var(--putih);border:3px solid var(--putih);font:600 18px 'Fredoka',system-ui,sans-serif;z-index:4;box-shadow:0 3px 10px rgba(0,0,0,.25);touch-action:none}
#run{right:max(28px,env(safe-area-inset-right));bottom:26px;width:92px;height:92px;background:var(--merah)}
#run.on{transform:scale(.93);background:#a81b21}
#jump{right:calc(max(28px,env(safe-area-inset-right)) + 106px);bottom:34px;width:78px;height:78px;background:#2f6fe4}
#jump.on{transform:scale(.93);background:#2358b8}
#aksi{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:132px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:4}
#aksi button{background:var(--putih);color:var(--hijau);border:2px solid var(--hijau);border-radius:18px;padding:9px 16px;font:600 15px 'Fredoka',system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:rgba(31,77,43,.92);color:var(--putih);padding:8px 16px;border-radius:18px;font-size:14px;z-index:7;pointer-events:none;opacity:0;transition:opacity .25s;max-width:80vw;text-align:center}
#toast.on{opacity:1}

/* HUD */
#topright{position:fixed;right:max(12px,env(safe-area-inset-right));top:10px;display:flex;gap:8px;align-items:center;z-index:6}
#hud{background:rgba(31,77,43,.82);color:var(--putih);padding:8px 14px;border-radius:20px;font-size:14px;font-weight:500;white-space:nowrap}
#chatbtn,#keluar{background:var(--putih);color:var(--hijau);border:2px solid var(--hijau);border-radius:20px;padding:7px 16px;font:600 15px 'Fredoka',system-ui,sans-serif;cursor:pointer}
#chat{position:fixed;left:max(12px,env(safe-area-inset-left));top:10px;width:min(42vw,340px);z-index:6;pointer-events:none}
#chatrow{display:none;gap:6px;margin-bottom:6px;pointer-events:auto}
#chatin{flex:1;min-width:0;border:2px solid var(--hijau);border-radius:16px;padding:8px 12px;font:500 15px 'Fredoka',system-ui,sans-serif;background:var(--putih);color:var(--hijau);user-select:text;-webkit-user-select:text}
#chatrow button{background:var(--merah);color:var(--putih);border:0;border-radius:16px;padding:0 14px;font:600 15px 'Fredoka',system-ui,sans-serif}
#log{display:flex;flex-direction:column;gap:4px;max-height:42vh;overflow:hidden;justify-content:flex-start}
.msg{background:rgba(255,248,238,.88);border-radius:12px;padding:5px 10px;font-size:14px;line-height:1.25;word-break:break-word;width:fit-content;max-width:100%}
.msg b{color:var(--merah);font-weight:600;margin-right:6px}
.msg.sys{background:rgba(31,77,43,.75);color:var(--putih);font-size:13px}
#log:not(.open) .msg.old{display:none}

/* layar awal */
#start{position:fixed;inset:0;z-index:20;overflow-y:auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(143,205,232,.25),rgba(31,77,43,.35));padding:12px}
#card{background:rgba(255,248,238,.95);border-radius:22px;padding:18px 22px;width:min(94vw,740px);display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#card h1{margin:0 0 6px;font-size:34px;line-height:1;color:var(--merah);font-weight:600}
#card p{margin:0 0 10px;font-size:15px;line-height:1.35}
#card label{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
#nama{width:100%;border:2px solid var(--hijau);border-radius:14px;padding:9px 12px;font:500 16px 'Fredoka',system-ui,sans-serif;background:#fff;color:var(--hijau);user-select:text;-webkit-user-select:text}
#warna{display:flex;gap:7px;margin:10px 0 12px;flex-wrap:wrap}
#warna button{width:28px;height:28px;border-radius:50%;border:3px solid transparent;padding:0;cursor:pointer}
#warna button.pilih{border-color:var(--hijau);box-shadow:0 0 0 2px var(--putih) inset}
#err{color:var(--merah);font-size:13px;margin-top:6px}

/* daftar server */
#btnbuat{width:100%;background:var(--hijau);color:var(--putih);border:0;border-radius:14px;padding:10px;font:600 16px 'Fredoka',system-ui,sans-serif;cursor:pointer}
#buat{gap:6px;margin-top:8px}
#snama{flex:1;min-width:0;border:2px solid var(--hijau);border-radius:14px;padding:8px 10px;font:500 15px 'Fredoka',system-ui,sans-serif;background:#fff;color:var(--hijau);user-select:text;-webkit-user-select:text}
#buat button{background:var(--merah);color:var(--putih);border:0;border-radius:14px;padding:0 12px;font:600 14px 'Fredoka',system-ui,sans-serif;cursor:pointer}
.jdl{font-size:15px;font-weight:600;margin-bottom:8px}
#daftar{max-height:min(58vh,260px);overflow-y:auto;padding-right:2px;touch-action:pan-y}
.srv{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border:2px solid var(--hijau);border-radius:14px;background:#fff;cursor:pointer;margin-bottom:7px}
.srv .info{display:flex;flex-direction:column;min-width:0}
.srv .info strong{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv .info span{font-size:13px;opacity:.8}
.srv .gabung{display:none;background:var(--merah);color:var(--putih);border:0;border-radius:12px;padding:9px 16px;font:600 15px 'Fredoka',system-ui,sans-serif;cursor:pointer}
.srv .gabung:disabled{background:#999}
.srv.pilih{border-color:var(--merah);background:#fff3e0}
.srv.pilih .gabung{display:block}
#mode{font-size:12px;line-height:1.3;margin-top:6px;opacity:.85}

/* gerbang landscape */
#rotate{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--hijau);color:var(--putih);text-align:center;padding:24px}
#rotate .hp{width:54px;height:92px;border:5px solid var(--putih);border-radius:12px;position:relative;animation:putar 2.4s ease-in-out infinite}
#rotate .hp::after{content:'';position:absolute;left:50%;bottom:6px;width:16px;height:4px;margin-left:-8px;background:var(--putih);border-radius:2px}
@keyframes putar{0%,25%{transform:rotate(0)}65%,100%{transform:rotate(-90deg)}}
#rotate h2{margin:0;font-size:24px;font-weight:600}
#rotate p{margin:0;font-size:16px;max-width:300px;line-height:1.35}
@media (prefers-reduced-motion:reduce){#rotate .hp{animation:none;transform:rotate(-90deg)}#toast{transition:none}}
@media (max-width:620px){#card{grid-template-columns:1fr;gap:10px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="joyzone"></div>
<div id="look"></div>
<div id="joy"><div id="knob"></div></div>
<div id="aksi"></div>
<button id="jump" type="button">Lompat</button>
<button id="run" type="button">Lari</button>
<div id="toast"></div>

<div id="chat">
  <form id="chatrow" autocomplete="off">
    <input id="chatin" maxlength="120" placeholder="Tulis pesan untuk semua pemain" enterkeyhint="send">
    <button type="submit">Kirim</button>
  </form>
  <div id="log"></div>
</div>
<div id="topright">
  <div id="hud">Menyambung…</div>
  <button id="chatbtn" type="button">Chat</button>
  <button id="keluar" type="button" style="display:none">Keluar</button>
</div>

<div id="start">
  <div id="card">
    <div id="kiri">
      <h1>Desa Kopdes</h1>
      <p>Pilih server, lalu keliling desa bareng pemain lain.</p>
      <label for="nama">Nama kamu</label>
      <input id="nama" maxlength="12" placeholder="Contoh: Budi" autocomplete="off">
      <div id="warna" aria-label="Pilih warna baju"></div>
      <button id="btnbuat" type="button">Buat server</button>
      <form id="buat" style="display:none" autocomplete="off">
        <input id="snama" maxlength="20" placeholder="Nama server">
        <button type="submit">Buat &amp; masuk</button>
      </form>
      <div id="err"></div>
    </div>
    <div id="kanan">
      <div class="jdl">Daftar server</div>
      <div id="daftar"></div>
      <div id="mode"></div>
    </div>
  </div>
</div>

<div id="rotate">
  <div class="hp"></div>
  <h2>Putar HP ke mode landscape</h2>
  <p>Game ini cuma bisa dimainkan dengan layar miring. Matikan kunci rotasi layar kalau layar tidak mau berputar.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>

(() => {
'use strict';
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  const d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  return a + d * t;
};

if (typeof THREE === 'undefined') {
  $('err').textContent = 'Three.js gagal dimuat. Cek koneksi internet lalu muat ulang.';
  return;
}

const BOUND = 48;
const WALK = 5, RUN = 9.5;
const COLORS = [0xe4572e, 0x29a3a3, 0xf2b134, 0x6a4c93, 0x2e933c, 0xd7428a, 0x3a6ea5, 0xef8354];
const SKIN = [0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524];

/* ---------- renderer & scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('game'), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fcde8);
scene.fog = new THREE.Fog(0x8fcde8, 45, 120);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 220);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6b8f4e, 0.9));
const sun = new THREE.DirectionalLight(0xfff1d6, 0.7);
sun.position.set(30, 50, 20);
scene.add(sun);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;

}

/* ---------- helper ---------- */
const mats = {}, geoCache = {};
const mat = c => mats[c] || (mats[c] = new THREE.MeshLambertMaterial({ color: c }));
function boxGeo(w, h, d) {
  const k = w + ',' + h + ',' + d;
  return geoCache[k] || (geoCache[k] = new THREE.BoxGeometry(w, h, d));
}
function box(w, h, d, c, x, y, z, parent = scene) {
  const m = new THREE.Mesh(boxGeo(w, h, d), mat(c));
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
const boxes = [], circles = [], zonaKosong = [];
const solidBox = (cx, cz, w, d) => boxes.push({ x0: cx - w / 2, x1: cx + w / 2, z0: cz - d / 2, z1: cz + d / 2 });
const solidCircle = (x, z, r) => circles.push({ x, z, r });

function makeSign(text, w, h, bg, fg, px, border) {
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = Math.round(1024 * h / w);
  const c = cv.getContext('2d');
  c.fillStyle = bg; c.fillRect(0, 0, cv.width, cv.height);
  if (border) { c.strokeStyle = border; c.lineWidth = 12; c.strokeRect(8, 8, cv.width - 16, cv.height - 16); }
  c.fillStyle = fg; c.font = '600 ' + px + 'px Fredoka, Arial, sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const lines = text.split('\n');
  lines.forEach((l, i) => c.fillText(l, cv.width / 2, cv.height * (i + 1) / (lines.length + 1)));
  const t = new THREE.CanvasTexture(cv);
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: t }));
}
function roof(cx, cy, cz, len, depth, rise, color) {
  const half = depth / 2, sl = Math.hypot(half, rise) + 0.3, ang = Math.atan2(rise, half);
  const a = box(len, 0.35, sl, color, cx, cy + rise / 2 + 0.1, cz - half / 2);
  a.rotation.x = -ang;
  const b = box(len, 0.35, sl, color, cx, cy + rise / 2 + 0.1, cz + half / 2);
  b.rotation.x = ang;
}
function gable(x, cy, cz, depth, rise, color) {
  const s = new THREE.Shape();
  s.moveTo(-depth / 2, 0); s.lineTo(depth / 2, 0); s.lineTo(0, rise);
  const m = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide }));
  m.rotation.y = Math.PI / 2;
  m.position.set(x, cy, cz);
  scene.add(m);
}

/* ---------- label nama + balon chat ---------- */
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function wrap(c, text, maxW, maxLines) {
  const lines = []; let cur = '', cut = false;
  for (const ch of text) {
    const t = cur + ch;
    if (c.measureText(t).width > maxW) {
      const sp = cur.lastIndexOf(' ');
      if (sp > 0) { lines.push(cur.slice(0, sp)); cur = cur.slice(sp + 1) + ch; }
      else { lines.push(cur); cur = ch; }
      if (lines.length === maxLines) { cut = true; break; }
    } else cur = t;
  }
  if (!cut && cur) lines.push(cur);
  if (cut) lines[lines.length - 1] += '…';
  return lines;
}
const allLabels = [];
function makeLabel(name, yOff) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(4, 2, 1); sp.position.y = yOff || 3.25; sp.renderOrder = 10;
  const L = {
    sp, name, msg: '', until: 0,
    draw() {
      const c = cv.getContext('2d');
      c.clearRect(0, 0, 512, 256);
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = '600 40px Fredoka, system-ui, sans-serif';
      const w = Math.min(c.measureText(L.name).width + 36, 500);
      rr(c, 256 - w / 2, 196, w, 50, 25); c.fillStyle = 'rgba(31,77,43,.82)'; c.fill();
      c.fillStyle = '#fff8ee'; c.fillText(L.name, 256, 221);
      if (L.msg) {
        c.font = '500 32px Fredoka, system-ui, sans-serif';
        const lines = wrap(c, L.msg, 440, 2);
        let bw = 0; lines.forEach(l => { bw = Math.max(bw, c.measureText(l).width); });
        bw = Math.min(bw + 44, 500);
        const bh = lines.length * 40 + 24, top = 184 - bh;
        rr(c, 256 - bw / 2, top, bw, bh, 22); c.fillStyle = '#fff8ee'; c.fill();
        c.lineWidth = 4; c.strokeStyle = '#d2232a'; c.stroke();
        c.fillStyle = '#1f4d2b';
        lines.forEach((l, i) => c.fillText(l, 256, top + 12 + 20 + i * 40));
      }
      tex.needsUpdate = true;
    },
    say(t, ms) { L.msg = t; L.until = performance.now() + (ms || 6000); L.draw(); }
  };
  L.draw();
  allLabels.push(L);
  return L;
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => allLabels.forEach(l => l.draw()));

/* ---------- avatar blok ---------- */
function makeAvatar(name, ci, opts) {
  opts = opts || {};
  const g = new THREE.Group(), body = new THREE.Group();
  g.add(body);
  const c = COLORS[ci % COLORS.length], skin = SKIN[ci % SKIN.length];
  box(0.7, 0.85, 0.4, c, 0, 1.15, 0, body);
  box(0.5, 0.5, 0.5, skin, 0, 1.85, 0, body);
  box(0.53, 0.16, 0.53, 0x2b2118, 0, 2.07, 0, body);
  box(0.08, 0.08, 0.02, 0x222222, -0.12, 1.88, 0.26, body);
  box(0.08, 0.08, 0.02, 0x222222, 0.12, 1.88, 0.26, body);
  const pivot = (x, y, bw, bh, col) => {
    const p = new THREE.Group(); p.position.set(x, y, 0);
    box(bw, bh, 0.3, col, 0, -bh / 2, 0, p); body.add(p); return p;
  };
  const legL = pivot(-0.18, 0.75, 0.28, 0.75, 0x2f3e5c);
  const legR = pivot(0.18, 0.75, 0.28, 0.75, 0x2f3e5c);
  const armL = pivot(-0.47, 1.52, 0.2, 0.7, skin);
  const armR = pivot(0.47, 1.52, 0.2, 0.7, skin);
  const blob = new THREE.Mesh(new THREE.CircleGeometry(0.6, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.07; body.add(blob);
  let label;
  if (opts.label === false) label = { msg: '', until: 0, say() {}, draw() {} };
  else { label = makeLabel(name); g.add(label.sp); }
  scene.add(g);
  return { g, body, label, legL, legR, armL, armR, phase: 0, amp: 0 };
}
function animateAvatar(av, speed, dt) {
  av.phase += dt * (4 + speed * 1.2);
  av.amp += (Math.min(speed / 4.2, 1.2) - av.amp) * Math.min(dt * 10, 1);
  const s = Math.sin(av.phase) * 0.8 * av.amp;
  av.legL.rotation.x = s; av.legR.rotation.x = -s;
  av.armL.rotation.x = -s; av.armR.rotation.x = s;
}
function dropAvatar(av) {
  scene.remove(av.g);
  const i = allLabels.indexOf(av.label); if (i >= 0) allLabels.splice(i, 1);
}

/* ---------- tanah, jalan, sawah, tembok ---------- */
(function bangunTanah() {

function bebas(x, z, r) {
  if (Math.abs(x) < 4.5 || Math.abs(z - 12) < 4.5) return false;
  if (Math.hypot(x, z - 15) < 7) return false;
  if (Math.abs(x) > BOUND - 3 || Math.abs(z) > BOUND - 3) return false;
  for (const b of boxes) if (x > b.x0 - r - 2 && x < b.x1 + r + 2 && z > b.z0 - r - 2 && z < b.z1 + r + 2) return false;
  for (const b of zonaKosong) if (x > b.x0 - 1 && x < b.x1 + 1 && z > b.z0 - 1 && z < b.z1 + 1) return false;
  for (const c of circles) if (Math.hypot(x - c.x, z - c.z) < c.r + r + 2) return false;
  return true;
}

/* ---------- tabrakan ---------- */
function collide(p, r) {
  for (const b of boxes) {
    const x0 = b.x0 - r, x1 = b.x1 + r, z0 = b.z0 - r, z1 = b.z1 + r;
    if (p.x > x0 && p.x < x1 && p.z > z0 && p.z < z1) {
      const dl = p.x - x0, dr = x1 - p.x, dt = p.z - z0, db = z1 - p.z;
      const m = Math.min(dl, dr, dt, db);
      if (m === dl) p.x = x0; else if (m === dr) p.x = x1; else if (m === dt) p.z = z0; else p.z = z1;
    }
  }
  for (const c of circles) {
    const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), min = c.r + r;
    if (d < min) {
      if (d < 1e-4) p.x += min; else { p.x = c.x + dx / d * min; p.z = c.z + dz / d * min; }
    }
  }
  const lim = BOUND - 1;
  p.x = clamp(p.x, -lim, lim); p.z = clamp(p.z, -lim, lim);
}

let spam = [];
function waifuAct(kind) {
  const now = performance.now();
  spam = spam.filter(t => now - t < 8000); spam.push(now);
  let k, t;
  if (spam.length >= 5) {
    k = 'marah'; t = pick(['Udah ah! Berisik banget!', 'Hmph! Jangan ganggu terus dong!', 'Aku lagi kerja tau!']);
  } else if (kind === 'sapa') {
    k = 'senang'; t = pick(['Halo, ' + me.name + '-kun! Selamat datang~', 'Ohayou, ' + me.name + '! Semangat ya!', 'Hai hai ' + me.name + '! Mau keliling desa?']);
  } else if (kind === 'puji') {
    k = 'malu'; t = pick(['E-eh?! J-jangan bilang gitu... makasih ya!', 'Kyaa~ jadi malu... ♥', 'B-bukan berarti aku senang, lho!']);
  } else {
    k = 'marah'; t = pick(['Hmph! Dasar nyebelin!', 'Aku marah nih, tau!', 'Jahat banget! Pergi sana!']);
  }
  W.react(k, t);
  net.send('npc', { id: me.id, n: me.name, k, t });
  addChat('Mimi', t);
}
function enterVeh(i) {
  if (ride || rid.has(i)) return;
  const p = parked[i];
  ride = { idx: i, speed: 0 };
  me.x = p.home.x; me.z = p.home.z; me.rot = p.home.r; me.y = 0; me.vy = 0;
  yaw = me.rot + Math.PI;
  toast(p.type === 'car' ? 'Naik mobil! Joystick: gas & belok.' : 'Naik motor! Joystick: gas & belok.');
}
function exitVeh() {
  if (!ride) return;
  const p = parked[ride.idx], r = me.rot;
  p.home = { x: me.x, z: me.z, r };
  const off = p.type === 'car' ? 2.4 : 1.4;
  me.x += -Math.cos(r) * off; me.z += Math.sin(r) * off;
  collide(me, 0.45);
  ride = null;
}
function beli(jenis) {
  const now = performance.now();
  if (jenis === 'alfa') { buff.speed = now + 15000; toast('Beli minuman dingin! Larimu lebih kencang 15 detik.'); }
  else { buff.jump = now + 15000; toast('Beli snack! Lompatanmu lebih tinggi 15 detik.'); }
}
let aksiSig = '';
function refreshAksi() {
  const list = [];
  if (ride) list.push({ k: 'turun', t: 'Turun', f: exitVeh });
  else {
    if (Math.hypot(me.x - W.x, me.z - W.z) < 4.8) {
      list.push({ k: 'sapa', t: 'Sapa Mimi', f: () => waifuAct('sapa') });
      list.push({ k: 'puji', t: 'Puji', f: () => waifuAct('puji') });
      list.push({ k: 'ledek', t: 'Ledek', f: () => waifuAct('ledek') });
    }
    let bi = -1, bd = 3.6;
    parked.forEach((p, i) => {
      if (rid.has(i)) return;
      const d = Math.hypot(me.x - p.home.x, me.z - p.home.z);
      if (d < bd) { bd = d; bi = i; }
    });
    if (bi >= 0) list.push({ k: 'naik' + bi, t: 'Naik ' + (parked[bi].type === 'car' ? 'mobil' : 'motor'), f: () => enterVeh(bi) });
    if (Math.hypot(me.x + 16, me.z - 8.8) < 5.5) list.push({ k: 'alfa', t: 'Beli minuman', f: () => beli('alfa') });
    if (Math.hypot(me.x - 16, me.z - 8.8) < 5.5) list.push({ k: 'indo', t: 'Beli snack', f: () => beli('indo') });
  }
  aksiList = list;
  const sig = list.map(a => a.k).join('|');
  if (sig === aksiSig) return;
  aksiSig = sig;
  const el = $('aksi');
  el.textContent = '';
  list.forEach(a => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = a.t;
    b.addEventListener('click', a.f);
    el.appendChild(b);
  });
}

/* ---------- jaringan & lobi server ---------- */
const DEFAULT_ROOMS = [
  { id: 'desa-1', name: 'Desa Kopdes 1' },
  { id: 'desa-2', name: 'Desa Kopdes 2' },
  { id: 'desa-3', name: 'Desa Kopdes 3' }
];
const MAX_PLAYERS = 20;
const LOBBY = CHANNEL + '-lobi';
let sbUrl = String(SUPABASE_URL || '').trim(), sbKey = String(SUPABASE_ANON_KEY || '').trim();
try { if (sbUrl) sbUrl = new URL(sbUrl).origin; } catch (e) { sbUrl = ''; }
const useSb = !!(sbUrl && sbKey && window.supabase);
const sb = useSb ? window.supabase.createClient(sbUrl, sbKey, { realtime: { params: { eventsPerSecond: 10 } } }) : null;
let lobbyOk = false;
function setMode(text, bad) {
  const m = $('mode');
  m.textContent = text;
  m.style.color = bad ? '#d2232a' : '';
  m.style.fontWeight = bad ? '600' : '';
}
const net = { send() {}, ready: false, mode: useSb ? 'online' : 'lokal' };
let room = { id: '', name: '' };
const peers = new Map();
let selected = '';
let lobbyCh = null, lobbyBC = null, roomCh = null, roomBC = null;

function trackMine() {
  if (lobbyCh && room.id) lobbyCh.track({ room: room.id, roomName: room.name });
  if (lobbyBC) lobbyBC.postMessage({ id: me.id, room: room.id || null, roomName: room.name });
}
function startLobby() {
  if (sb) {
    lobbyCh = sb.channel(LOBBY, { config: { presence: { key: me.id } } });
    lobbyCh.on('presence', { event: 'sync' }, () => {
      peers.clear();
      const st = lobbyCh.presenceState();
      for (const key in st) {
        if (key === me.id) continue;
        const arr = st[key], m = arr[arr.length - 1];
        if (m && m.room) peers.set(key, { room: String(m.room).slice(0, 40), roomName: String(m.roomName || '').slice(0, 24) });
      }
      renderServers();
    });
    lobbyCh.subscribe((s, err) => {
      if (s === 'SUBSCRIBED') {
        lobbyOk = true;
        setMode('Terhubung ke server ✓');
        if (room.id) trackMine();
      } else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT' || s === 'CLOSED') {
        lobbyOk = false;
        setMode('Gagal tersambung (' + s + ')' + (err && err.message ? ': ' + err.message : '') + '. Cek URL, key, dan "Allow public access" di Supabase.', true);
      }
    });
  } else if ('BroadcastChannel' in window) {
    lobbyBC = new BroadcastChannel(LOBBY);
    lobbyBC.onmessage = e => {
      const d = e.data;
      if (!d || d.id === me.id) return;
      if (d.room) peers.set(d.id, { room: String(d.room).slice(0, 40), roomName: String(d.roomName || '').slice(0, 24), t: Date.now() });
      else peers.delete(d.id);
      renderServers();
    };
    setInterval(() => {
      const now = Date.now(); let changed = false;
      peers.forEach((v, k) => { if (now - v.t > 6000) { peers.delete(k); changed = true; } });
      lobbyBC.postMessage({ id: me.id, room: room.id || null, roomName: room.name });
      if (changed) renderServers();
    }, 2000);
  }
}

function serverList() {
  const map = new Map();
  DEFAULT_ROOMS.forEach(r => map.set(r.id, { id: r.id, name: r.name, n: 0 }));
  peers.forEach(p => {
    let r = map.get(p.room);
    if (!r) { r = { id: p.room, name: p.roomName || 'Server', n: 0 }; map.set(p.room, r); }
    r.n++;
  });
  return Array.from(map.values());
}
function renderServers() {
  const el = $('daftar');
  if (!el) return;
  const top = el.scrollTop;
  el.textContent = '';
  serverList().forEach(r => {
    const row = document.createElement('div');
    row.className = 'srv' + (r.id === selected ? ' pilih' : '');
    const info = document.createElement('div'); info.className = 'info';
    const nm = document.createElement('strong'); nm.textContent = r.name;
    const ct = document.createElement('span');
    ct.textContent = r.n >= MAX_PLAYERS ? 'Penuh · ' + r.n + '/' + MAX_PLAYERS : r.n + '/' + MAX_PLAYERS + ' pemain';
    info.appendChild(nm); info.appendChild(ct);
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'gabung';
    btn.textContent = r.n >= MAX_PLAYERS ? 'Penuh' : 'Gabung';
    btn.disabled = r.n >= MAX_PLAYERS;
    btn.addEventListener('click', ev => { ev.stopPropagation(); joinRoom(r); });
    row.appendChild(info); row.appendChild(btn);
    row.addEventListener('click', () => { selected = r.id; renderServers(); });
    el.appendChild(row);
  });
  el.scrollTop = top;
}

function myPos() {
  return { id: me.id, n: me.name, c: me.color, x: +me.x.toFixed(2), z: +me.z.toFixed(2), r: +me.rot.toFixed(2), y: +me.y.toFixed(2), v: ride ? ride.idx : -1 };
}
function startRoomNet() {
  const topic = CHANNEL + '-' + room.id;
  const hello = () => net.send('pos', myPos());
  if (sb) {
    const ch = sb.channel(topic, { config: { broadcast: { self: false } } });
    roomCh = ch;
    ['pos', 'chat', 'bye', 'npc'].forEach(ev => ch.on('broadcast', { event: ev }, m => onEvt(ev, m.payload)));
    net.ready = false;
    ch.subscribe(s => { if (roomCh === ch) { net.ready = s === 'SUBSCRIBED'; if (net.ready) hello(); } });
    net.send = (ev, payload) => { if (net.ready && roomCh) roomCh.send({ type: 'broadcast', event: ev, payload }); };
  } else if ('BroadcastChannel' in window) {
    roomBC = new BroadcastChannel(topic);
    roomBC.onmessage = e => onEvt(e.data.ev, e.data.payload);
    net.send = (ev, payload) => { if (roomBC) roomBC.postMessage({ ev, payload }); };
    net.ready = true;
    hello();
  }
}

function onEvt(ev, p) {
  if (!p || typeof p !== 'object' || p.id === me.id) return;
  const name = String(p.n || 'Warga').slice(0, 14);
  if (ev === 'pos') {
    const x = Number(p.x), z = Number(p.z), r = Number(p.r);
    if (!isFinite(x) || !isFinite(z)) return;
    const y = isFinite(Number(p.y)) ? clamp(Number(p.y), 0, 5) : 0;
    const v = Number.isInteger(p.v) && p.v >= 0 && p.v < parked.length ? p.v : -1;
    let o = players.get(p.id);
    if (!o) {
      o = { av: makeAvatar(name, Number(p.c) || 0), name, x, z, y, ty: y, v, r: r || 0, tx: x, tz: z, tr: r || 0, last: 0 };
      o.av.g.position.set(x, 0, z);
      players.set(p.id, o);
      addChat('', name + ' masuk desa', 'sys');
    }
    o.tx = clamp(x, -BOUND, BOUND); o.tz = clamp(z, -BOUND, BOUND); o.tr = isFinite(r) ? r : o.tr;
    o.ty = y; o.v = v;
    o.last = performance.now();
  } else if (ev === 'chat') {
    const t = String(p.t || '').slice(0, 120);
    if (!t) return;
    addChat(name, t);
    const o = players.get(p.id);
    if (o) o.av.label.say(t.slice(0, 70));
  } else if (ev === 'npc') {
    const k = String(p.k);
    if (['senang', 'malu', 'marah'].indexOf(k) < 0) return;
    const t = String(p.t || '').slice(0, 60);
    W.react(k, t);
    if (t) addChat('Mimi', t);
  } else if (ev === 'bye') {
    removeRemote(p.id);
  }
}
function removeRemote(id) {
  const o = players.get(id);
  if (!o) return;
  dropAvatar(o.av);
  players.delete(id);
  addChat('', o.name + ' keluar desa', 'sys');
}
window.addEventListener('pagehide', () => net.send('bye', { id: me.id }));

function joinRoom(r) {
  if (started) return;
  const n = $('nama').value.trim().slice(0, 12) || 'Warga' + Math.floor(rand(100, 999));
  me.name = n;
  try { localStorage.setItem('nama', n); } catch (e) {}
  try {
    const el = document.documentElement, rf = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rf) Promise.resolve(rf.call(el)).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => {});
  } catch (e) {}
  room = { id: r.id, name: r.name };
  me.x = rand(-3, 3); me.z = rand(14, 18); me.rot = 0; me.y = 0; me.vy = 0;
  sx = me.x; sz = me.z; sr = me.rot; sy = 0; sv = -1; netT = 0;

function leaveRoom() {
  if (ride) exitVeh();
  net.send('bye', { id: me.id });
  if (roomCh && sb) { sb.removeChannel(roomCh); }
  roomCh = null;
  if (roomBC) { roomBC.close(); roomBC = null; }
  net.send = () => {}; net.ready = false;
  players.forEach(o => dropAvatar(o.av));
  players.clear();
  parked.forEach(p => { p.home = { x: p.mesh.position.x, z: p.mesh.position.z, r: p.mesh.rotation.y }; });
  if (meAv) { dropAvatar(meAv); meAv = null; }
  room = { id: '', name: '' };
  if (lobbyCh) lobbyCh.untrack();
  if (lobbyBC) lobbyBC.postMessage({ id: me.id, room: null });
  started = false;
  closeChat();
  logEl.textContent = '';

let last = performance.now(), netT = 0, hudT = 0, aksiT = 0, sx = 0, sz = 0, sr = 0, sy = 0, sv = -1;

function updateWorld(dt, now) {
  const t = now / 1000;
  // mahasiswa demo
  crowd.forEach(s => {
    const a = s.av;
    a.armR.rotation.x = -2.7 + Math.sin(t * 5 + s.i) * 0.4;
    a.armL.rotation.x = s.i % 2 ? -2.7 + Math.sin(t * 5 + s.i + 1) * 0.4 : 0.15;
    a.g.position.y = Math.max(0, Math.sin(t * 5 + s.i)) * 0.07;
  });
  chantT -= dt;
  if (chantT <= 0 && korlap) {
    chantT = 5;
    korlap.label.say(CHANTS[chantI++ % CHANTS.length], 3800);
  }
  if (korlap && korlap.label.msg && now > korlap.label.until) { korlap.label.msg = ''; korlap.label.draw(); }

  // Mimi
  const dm = Math.hypot(me.x - W.x, me.z - W.z);
  if (dm < 14) W.rot = lerpAngle(W.rot, Math.atan2(me.x - W.x, me.z - W.z), 1 - Math.exp(-4 * dt));
  W.g.rotation.y = W.rot;
  const emo = W.emo;
  let bob = Math.sin(t * 2) * 0.03, tilt = 0, shake = 0;
  if (emo === 'senang') bob = Math.abs(Math.sin(t * 7)) * 0.18;
  if (emo === 'malu') tilt = 0.16 + Math.sin(t * 6) * 0.03;
  if (emo === 'marah') { bob = Math.abs(Math.sin(t * 9)) * 0.1; shake = Math.sin(t * 40) * 0.05; }
  W.g.position.y = bob;
  W.head.rotation.z = tilt + shake;
  W.tails[0].rotation.z = 0.08 + Math.sin(t * 2.2) * 0.05 + (emo === 'senang' ? Math.sin(t * 9) * 0.08 : 0);
  W.tails[1].rotation.z = -0.08 - Math.sin(t * 2.2) * 0.05 - (emo === 'senang' ? Math.sin(t * 9) * 0.08 : 0);
  W.armR.rotation.z = emo === 'senang' ? 2.4 + Math.sin(t * 12) * 0.45 : (emo === 'marah' ? 0.9 : 0.12);
  W.armL.rotation.z = emo === 'marah' ? -0.9 : -0.12;
  W.armR.rotation.x = 0; W.armL.rotation.x = emo === 'malu' ? -1.6 : 0;
  if (emo !== 'netral' && now > W.emoUntil) { W.emo = 'netral'; W.drawFace('netral'); }
  if (W.label.msg && now > W.label.until) { W.label.msg = ''; W.label.draw(); }
  W.idleT -= dt;
  if (W.idleT <= 0) {
    W.idleT = 16;
    if (dm < 14 && W.emo === 'netral' && !W.label.msg) {
      W.label.say(pick([
        'Cari belanjaan? Alfamart dan Indomaret ada di pinggir jalan~',
        'Motor dan mobil di dekat sini boleh dinaiki lho!',
        'Mahasiswa lagi demo di depan Kopdes, rame banget!',
        'Mau jajan? Beli minuman atau snack biar makin kuat!'
      ]), 5000);
    }
  }
}

function update(dt, now) {
  let ix = input.x, iy = input.y;
  if (!chatOpen) {
    if (keys.KeyA || keys.ArrowLeft) ix -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1;
    if (keys.KeyW || keys.ArrowUp) iy += 1;
    if (keys.KeyS || keys.ArrowDown) iy -= 1;
  }
  const run = runHeld || keys.ShiftLeft || keys.ShiftRight;
  const mag = Math.hypot(ix, iy);

  if (ride) {
    const P = VEH[parked[ride.idx].type];
    const thr = clamp(iy, -1, 1), st = clamp(ix, -1, 1);
    const boost = run ? 1.3 : 1;
    const target = thr > 0 ? thr * P.max * boost : thr * P.max * 0.4;
    let rate;
    if (Math.abs(thr) < 0.05) rate = 8;
    else rate = (Math.sign(target) !== Math.sign(ride.speed) && ride.speed !== 0) ? P.brake : P.acc;
    ride.speed += clamp(target - ride.speed, -rate * dt, rate * dt);
    me.rot -= st * P.turn * clamp(Math.abs(ride.speed) / 4, 0, 1) * (ride.speed >= 0 ? 1 : -1) * dt;
    const ox = me.x, oz = me.z;
    const want = Math.abs(ride.speed) * dt;
    me.x += Math.sin(me.rot) * ride.speed * dt;
    me.z += Math.cos(me.rot) * ride.speed * dt;
    collide(me, P.r);
    const got = Math.hypot(me.x - ox, me.z - oz);
    if (want > 0.02 && got < want * 0.5) ride.speed *= 0.5;
    curSpeed = 0;
    parked[ride.idx].home = { x: me.x, z: me.z, r: me.rot };
    me.y = 0; me.vy = 0; jumpReq = false;
  } else {
    const spdBuff = now < buff.speed ? 1.25 : 1;
    const speed = (run ? RUN : WALK) * spdBuff;
    if (mag > 0.05) {
      const m = Math.min(mag, 1);
      const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
      let dx = fx * iy + rx * ix, dz = fz * iy + rz * ix;
      const l = Math.hypot(dx, dz); dx /= l; dz /= l;
      me.x += dx * speed * m * dt; me.z += dz * speed * m * dt;
      collide(me, 0.45);
      me.rot = lerpAngle(me.rot, Math.atan2(dx, dz), 1 - Math.exp(-14 * dt));
      curSpeed = speed * m;
    } else curSpeed = 0;
    if (jumpReq) {
      if (me.y <= 0.001) me.vy = now < buff.jump ? 10.5 : 7.8;
      jumpReq = false;
    }
    me.vy -= 24 * dt; me.y += me.vy * dt;
    if (me.y <= 0) { me.y = 0; me.vy = 0; }
  }

  const vp = ride ? parked[ride.idx] : null;
  meAv.g.position.set(me.x, me.y, me.z);
  meAv.g.rotation.y = me.rot;
  meAv.body.visible = !vp || vp.type === 'motor';
  meAv.body.position.y = vp && vp.type === 'motor' ? 0.25 : 0;
  animateAvatar(meAv, ride ? 0 : curSpeed, dt);
  if (meAv.label.msg && now > meAv.label.until) { meAv.label.msg = ''; meAv.label.draw(); }

  if (ride) yaw = lerpAngle(yaw, me.rot + Math.PI, 1 - Math.exp(-4 * dt));
  const d = ride ? 9.5 : 7, ch = Math.cos(pitch);
  camera.position.set(
    clamp(me.x + Math.sin(yaw) * ch * d, -BOUND + 0.5, BOUND - 0.5),
    1.6 + me.y * 0.5 + Math.sin(pitch) * d,
    clamp(me.z + Math.cos(yaw) * ch * d, -BOUND + 0.5, BOUND - 0.5)
  );
  camera.lookAt(me.x, 1.5 + me.y * 0.5, me.z);

  netT += dt * 1000;
  const v = ride ? ride.idx : -1;
  const moved = Math.abs(me.x - sx) > 0.02 || Math.abs(me.z - sz) > 0.02 || Math.abs(me.rot - sr) > 0.05 || Math.abs(me.y - sy) > 0.03 || v !== sv;
  if ((moved && netT > 150) || netT > 1000) {
    net.send('pos', myPos());
    sx = me.x; sz = me.z; sr = me.rot; sy = me.y; sv = v; netT = 0;
  }

  for (const [id, o] of Array.from(players)) {
    if (now - o.last > 5000) { removeRemote(id); continue; }
    const k = 1 - Math.exp(-12 * dt), px = o.x, pz = o.z;
    o.x += (o.tx - o.x) * k; o.z += (o.tz - o.z) * k; o.y += (o.ty - o.y) * k;
    o.r = lerpAngle(o.r, o.tr, k);
    const pv = o.v >= 0 ? parked[o.v] : null;
    o.av.g.position.set(o.x, pv ? 0 : o.y, o.z); o.av.g.rotation.y = o.r;
    o.av.body.visible = !pv || pv.type === 'motor';
    o.av.body.position.y = pv && pv.type === 'motor' ? 0.25 : 0;
    if (pv) pv.home = { x: o.x, z: o.z, r: o.r };
    animateAvatar(o.av, pv ? 0 : Math.hypot(o.x - px, o.z - pz) / Math.max(dt, 0.001), dt);
    const L = o.av.label;
    if (L.msg && now > L.until) { L.msg = ''; L.draw(); }
  }

  rid = new Set();
  if (ride) rid.add(ride.idx);
  players.forEach(o => { if (o.v >= 0) rid.add(o.v); });
  parked.forEach(p => {
    const m = p.mesh, px = m.position.x, pz = m.position.z;
    m.position.set(p.home.x, 0, p.home.z);
    m.rotation.y = p.home.r;
    const dx = p.home.x - px, dz = p.home.z - pz;
    const dist = Math.hypot(dx, dz);
    if (dist > 0.0001) {
      const sg = Math.sign(dx * Math.sin(p.home.r) + dz * Math.cos(p.home.r)) || 1;
      p.spin += sg * dist / 0.35;
      p.wheels.forEach(w => { w.rotation.x = p.spin; });
    }
  });

  updateWorld(dt, now);

  aksiT += dt;
  if (aksiT > 0.15) { aksiT = 0; refreshAksi(); }

  hudT += dt;
  if (hudT > 0.5) {
    hudT = 0;
    const n = players.size + 1;
    $('hud').textContent = (net.ready ? '● ' : '○ ') + room.name + ' · ' + n + ' pemain' + (net.mode === 'lokal' ? ' (tes)' : '');
  }
}
function orbit(now) {
  const a = now * 0.00008;
  camera.position.set(Math.sin(a) * 36, 13, -6 + Math.cos(a) * 36);
  camera.lookAt(0, 3, -6);
  updateWorld(0.016, now);
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (started) update(dt, now); else orbit(now);
  renderer.render(scene, camera);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
$('hud').textContent = 'Pilih server';
startLobby();
renderServers();
requestAnimationFrame(frame);
})();
</script>
